[project]
name = "spectator"
version = "0.4.7"
description = "Thin CLI wrapper around NVIDIA's Video Search & Summarization (VSS) Blueprint v3.1, with a sibling Whisper audio pipeline. Designed for DGX Spark (GB10), works on any v3.1-supported host."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mikhail Yurasov" }]
requires-python = ">=3.10"
keywords = [
    "nvidia",
    "vss",
    "video-search-and-summarization",
    "dgx-spark",
    "gb10",
    "whisper",
    "transcription",
    "blueprint",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0",
    # Web UI server (introduced in v0.2.0). All three are well-established
    # mainstream picks; FastAPI is the primary, uvicorn is its ASGI runner,
    # python-multipart is FastAPI's optional file-upload dep (made explicit).
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/myurasov/Spectator"
Repository = "https://github.com/myurasov/Spectator"
Issues = "https://github.com/myurasov/Spectator/issues"
"VSS Blueprint (upstream)" = "https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization"
"DGX Spark Playbook (upstream)" = "https://build.nvidia.com/spark/vss/instructions"

# Don't install this project itself — invoke as `./spectator` (which runs
# `python -m src` under PYTHONPATH=<project-root>) or `uv run python -m src`.
# This avoids setuptools' `__editable__*.pth` shim, which some cloud-synced
# filesystems mark UF_HIDDEN, blocking Python 3.12.13+ from loading it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
